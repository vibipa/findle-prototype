<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | Findle</title><meta name="description" content="Save deals and get alerts for new food deals near you."><meta name="robots" content="noindex,nofollow"><link rel="canonical" href="https://vibipa.github.io/findle-prototype/login.html">
<link rel="icon" href="https://vibipa.github.io/findle-prototype/logo/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="https://vibipa.github.io/findle-prototype/logo/favicon-32.png"><link rel="apple-touch-icon" href="https://vibipa.github.io/findle-prototype/logo/apple-touch-icon.png"><meta name="theme-color" content="#2563EB"><link rel="stylesheet" href="https://vibipa.github.io/findle-prototype/findle.css">
</head><body>
<header class="top"><a class="logo" href="https://vibipa.github.io/findle-prototype/" aria-label="Findle home"><img src="https://vibipa.github.io/findle-prototype/logo/findle-logo.svg" alt="Findle" height="32"></a><nav><a href="https://vibipa.github.io/findle-prototype/deals/angus.html">Deals</a><a href="https://vibipa.github.io/findle-prototype/businesses.html">Businesses</a><a class="signin" href="https://vibipa.github.io/findle-prototype/login.html">Sign in</a></nav></header><main><div class="auth"><h1 id="ah">Sign in to Findle</h1><p class="sub">Save deals and get alerts for new food deals near you.</p>
<form id="af"><label class="lb" id="nl" style="display:none">Name<input type="text" id="nm" autocomplete="name"></label><label class="lb">Email<input type="email" required autocomplete="email" placeholder="you@example.com"></label><label class="lb">Password<input type="password" required autocomplete="current-password" minlength="8"></label>
<button class="btn" type="submit" id="ab">Sign in</button> <button type="button" class="chip" id="tg">Create account</button><p class="s" id="am"></p></form></div>
<script>(function(){var f=document.getElementById("af"),m=document.getElementById("am"),t=document.getElementById("tg"),c=false;
f.addEventListener("submit",function(e){e.preventDefault();m.textContent="Prototype only: sign-in is not connected yet."});
if(t)t.addEventListener("click",function(){c=!c;document.getElementById("nl").style.display=c?"block":"none";document.getElementById("ah").textContent=c?"Create your free account":"Sign in to Findle";document.getElementById("ab").textContent=c?"Create account":"Sign in";t.textContent=c?"I have an account":"Create account"})})();</script></main><footer>Prototype for testing Google search results. Businesses, addresses, phone numbers, prices, distances and deals are samples, not real listings. Food images are illustrations.</footer></body></html>
